<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F5C44"/>
      <stop offset="1" stop-color="#143A2B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- soft accent blobs -->
  <circle cx="1080" cy="90" r="220" fill="#3E8E6E" opacity="0.35"/>
  <circle cx="120" cy="560" r="180" fill="#3E8E6E" opacity="0.25"/>

  <!-- brand mark -->
  <g transform="translate(90,90)">
    <rect width="64" height="64" rx="16" fill="#143A2B"/>
    <path d="M32 50C32 50 12 37 12 25C12 18.8 16.6 14 22.4 14C26 14 29.2 16 32 19.2C34.8 16 38 14 41.6 14C47.4 14 52 18.8 52 25C52 37 32 50 32 50Z" fill="#94a276"/>
    <text x="84" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#ffffff">iTrust<tspan fill="#BFE6CC">Wellness</tspan></text>
  </g>

  <!-- headline -->
  <text x="90" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="bold" fill="#ffffff">Mental health care for</text>
  <text x="90" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="bold" fill="#ffffff">your <tspan fill="#94a276">life's journey</tspan></text>

  <!-- subline -->
  <text x="92" y="452" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#DDF1E4">Compassionate, personalized psychiatry across South Carolina.</text>
  <text x="92" y="492" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#DDF1E4">You're welcome here.</text>

  <!-- badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">
    <rect x="90" y="540" width="290" height="56" rx="28" fill="#94a276"/>
    <text x="235" y="576" fill="#143A2B" text-anchor="middle">Telehealth &amp; in-person</text>
    <rect x="402" y="540" width="270" height="56" rx="28" fill="#ffffff" opacity="0.12"/>
    <text x="537" y="576" fill="#ffffff" text-anchor="middle">LGBTQIA+ affirming</text>
  </g>
</svg>
